set -g default-terminal tmux-256color # fix terminal colors

setw -g mode-keys vi        # vim movements in window mode (like in copy mode)
set -g set-clipboard        # system clipboard
set -g escape-time 0        # zero-out escape time delay
set -g base-index 1         # start window index at 1 (match keyboard order)
set -g pane-base-index 1    # ... and the same for panes
set -g renumber-windows on  # re-number windows sequentially after closing them
set -g mouse on             # set mouse mode on
set -g allow-passthrough on # pass control characters through to the terminal

bind r source-file ~/.tmux.conf \; display "Reloaded!"  # easier tmux config reloading

# OSC 8 hyperlinks in Ghostty
# ! make sure `mouse-shift-capture = false` is in the Ghostty config
# ! Claude + TMux doesn't work with shift-enter. Set this alias
# ! alias claude='TERM_PROGRAM=iTerm.app claude'
set -as terminal-features ',*:hyperlinks'

# previous window rebind to prefix + b (we'll use prefix + P for pasting later)
unbind-key b
bind-key b previous-window

# vim paste
unbind-key P
bind-key P run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer"

# vim copy yank
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"


# vim-motions for resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Make splitting easier to remember
bind '-' split-window -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

## Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Satusbar and Catppuccin Customization
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -g status-position top
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_window_middle_separator " █"

# ── Status Left: Prefix + Copy Mode indicators ────────────────
# Segment anatomy mirrors @catppuccin_status_* exactly.
# Separators use fg/bg flip — no hardcoded glyphs.
# Indicators are invisible when inactive (zero-width).
set -g status-left "\
#{?client_prefix,\
#[fg=#{@thm_red} bg=default]#{E:@catppuccin_status_left_separator}\
#[fg=#{@thm_crust} bg=#{@thm_red} bold] 󰘳 PREFIX \
#[fg=#{@thm_red} bg=default nobold]#{E:@catppuccin_status_right_separator}\
,}\
#{?pane_in_mode,\
#[fg=#{@thm_yellow} bg=default]#{E:@catppuccin_status_left_separator}\
#[fg=#{@thm_crust} bg=#{@thm_yellow} bold] 󰅏 COPY \
#[fg=#{@thm_yellow} bg=default nobold]#{E:@catppuccin_status_right_separator}\
,}"

## Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
